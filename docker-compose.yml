
# =============================================================================
# Health Dashboard — Docker Compose
# =============================================================================
# Start everything:  docker compose up --build
# Stop everything:   docker compose down
# Reset database:    docker compose down -v
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0 Database
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: health-dashboard-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-db_health_dashboard}
      MYSQL_USER: ${DB_USERNAME:-db_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-db_senha}
    ports:
      # TODO(security): Remove host port mapping in production.
      # Database should only be accessible from the Docker network.
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Laravel Backend API (accessible at http://localhost:9000)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./docker/backend
    container_name: health-dashboard-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    ports:
      - "9000:80"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-db_health_dashboard}
      DB_USERNAME: ${DB_USERNAME:-db_user}
      DB_PASSWORD: ${DB_PASSWORD:-db_senha}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Expo / React Native Mobile (dev server at http://localhost:8081)
  # ---------------------------------------------------------------------------
  mobile:
    build:
      context: ./docker/mobile
    container_name: health-dashboard-mobile
    restart: unless-stopped
    volumes:
      - ./mobile:/app
    ports:
      - "8081:8081"
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
    depends_on:
      - backend
    networks:
      - app-network
    stdin_open: true
    tty: true

volumes:
  mysqldata:
    driver: local

networks:
  app-network:
    driver: bridge
